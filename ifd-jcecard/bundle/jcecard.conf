# Configuration file for jcecard virtual smart card reader.
# Install to /etc/reader.conf.d/jcecard.
#
# The handler exposes two slots from a single .so:
#   slot 0 — jcecard Virtual Smart Card (OpenPGP + PIV, Yubikey-style ATR)
#   slot 1 — Nitrokey-flavoured card (admin + OATH + OpenPGP/PIV stubs,
#            Nitrokey 3 ATR — picked up by pynitrokey's PC/SC detection)
#
# pcscd surfaces each slot as its own reader, suffixed with the slot index
# (e.g. "jcecard Virtual Smart Card 00 00" and "...  00 01").

FRIENDLYNAME "jcecard Virtual Smart Card"
DEVICENAME   /dev/null
LIBPATH      /usr/lib/pcsc/drivers/ifd-jcecard.bundle/Contents/Linux/libifd_jcecard.so
CHANNELID    0x00

[package]
name = "ifd-jcecard"
version = "0.3.0"
edition = "2021"
description = "PC/SC IFD Handler for jcecard virtual OpenPGP and PIV smart card"
license = "LGPL-3.0-or-later"
readme = "README.md"
repository = "https://github.com/kushaldas/jcecard"
homepage = "https://github.com/kushaldas/jcecard"
documentation = "https://github.com/kushaldas/jcecard"
authors = ["Kushal Das <mail@kushaldas.in>"]
keywords = ["smartcard", "pcsc", "openpgp", "piv", "virtual"]
categories = ["cryptography", "hardware-support"]

[lib]
name = "ifd_jcecard"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ifd-jcecard-install"
path = "src/bin/ifd-jcecard-install.rs"

[features]
default = ["nitrokey"]
# Enables the slot-1 Nitrokey 3 card backed by the upstream Trussed stack
# (admin-app + opcard + piv-authenticator + secrets-app). Pulls in ~40
# dependency crates; disable with --no-default-features to keep just slot-0.
nitrokey = [
    "dep:apps",
    "dep:utils",
    "dep:apdu-dispatch",
    "dep:iso7816",
    "dep:heapless",
    "dep:heapless-bytes",
    "dep:hex-literal",
    "dep:interchange",
    "dep:littlefs2",
    "dep:littlefs2-core",
    "dep:trussed",
    "dep:trussed-core",
    "dep:admin-app",
    "dep:trussed-usbip",
    "dep:rand_chacha",
    "dep:generic-array",
]

[dependencies]
# Synchronization
once_cell = "1.19"
parking_lot = "0.12"

# Logging
log = "0.4"
env_logger = "0.11"

# FFI
libc = "0.2"

# Serialization (for JSON storage)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"

# Cryptography - RustCrypto ecosystem
rsa = { version = "0.9", features = ["std"] }
hmac = "0.12"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p384 = { version = "0.13", features = ["ecdsa", "ecdh"] }
p521 = { version = "0.13", features = ["ecdsa", "ecdh"] }
k256 = { version = "0.13", features = ["ecdsa", "ecdh"] }
des = "0.8"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
rand = "0.8"
rand_core = "0.6"

# Error handling
thiserror = "1.0"

# Directory management
dirs = "5.0"

# --- Nitrokey-backed slot-1 card (feature = "nitrokey") ------------------
# Version pins mirror nitrokey-3-firmware v1.8.3's workspace Cargo.toml.
# The `[patch.crates-io]` block below redirects registry coords to the exact
# git revisions the firmware ships, so our in-process Trussed stack is
# binary-compatible with a real NK3.
apps = { path = "vendor/nitrokey-3-firmware/components/apps", optional = true, default-features = false, features = ["nk3", "log-all", "trussed-usbip"] }
utils = { path = "vendor/nitrokey-3-firmware/components/utils", optional = true, default-features = false }
apdu-dispatch = { version = "0.4", optional = true }
iso7816 = { version = "0.2", optional = true }
heapless = { version = "0.8", optional = true }
heapless-bytes = { version = "0.5", optional = true }
hex-literal = { version = "0.4", optional = true }
interchange = { version = "0.3", optional = true }
littlefs2 = { version = "0.7", optional = true }
littlefs2-core = { version = "0.1", optional = true }
generic-array = { version = "0.14", optional = true }
# Enable P-384 + P-521 + secp256k1 software mechanisms on top of what
# `apps/nk3` already turns on (p256, ed255, x255, aes256-cbc, ...). Each
# feature chains to `trussed-core/<curve>` and pulls the pure-Rust impl,
# so the runtime dispatcher can service these curves — the `trussed-usbip`
# bypass in components/apps is only a compile-time gate, not a real impl.
trussed = { version = "0.1", optional = true, default-features = false, features = ["p384", "p521"] }
trussed-core = { version = "0.2", optional = true }
admin-app = { version = "0.1", optional = true }
trussed-usbip = { version = "0.0.1", optional = true, default-features = false }
rand_chacha = { version = "0.3", optional = true }

[patch.crates-io]
# Mirror nitrokey-3-firmware v1.8.3 [patch.crates-io] verbatim (absolute
# paths for the path-based entries so this builds without being in the
# firmware workspace).
memory-regions = { path = "vendor/nitrokey-3-firmware/components/memory-regions" }
p256-cortex-m4 = { git = "https://github.com/ycrypto/p256-cortex-m4.git", rev = "cdb31e12594b4dc1f045b860a885fdc94d96aee2" }
trussed = { git = "https://github.com/trussed-dev/trussed.git", rev = "0f8df68be879acdde1f8cf428c11e5d29692a47b" }
trussed-usbip = { git = "https://github.com/trussed-dev/pc-usbip-runner.git", rev = "017921df0930707c4af68882ccb1f8b3f1bbf7c5" }
admin-app = { git = "https://github.com/Nitrokey/admin-app.git", tag = "v0.1.0-nitrokey.21" }
opcard = { path = "vendor/opcard-rs" }
piv-authenticator = { git = "https://github.com/trussed-dev/piv-authenticator.git", tag = "v0.6.0" }
secrets-app = { git = "https://github.com/Nitrokey/trussed-secrets-app", tag = "v0.15.0" }
trussed-auth-backend = { git = "https://github.com/trussed-dev/trussed-auth", tag = "backend-v0.1.0" }
trussed-rsa-alloc = { git = "https://github.com/trussed-dev/trussed-rsa-backend.git", tag = "v0.4.0" }
trussed-se050-backend = { git = "https://github.com/Nitrokey/trussed-se050-backend.git", tag = "v0.7.0" }
trussed-staging = { git = "https://github.com/trussed-dev/trussed-staging.git", tag = "v0.4.0" }

[dev-dependencies]
hex = "0.4"
tempfile = "3.10"

[profile.release]
lto = true
opt-level = "z"
strip = true
